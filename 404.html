<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Страница не найдена — Антон Верт</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light; font-family: Inter, Arial, sans-serif; color: #192334; background: #f7f9fc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(720px, 100%); padding: clamp(32px, 7vw, 72px); background: #fff; border: 1px solid #dbe3ee; border-radius: 24px; box-shadow: 0 18px 50px rgba(31, 53, 84, .08); }
    .mark { display: inline-grid; place-items: center; width: 64px; height: 64px; margin-bottom: 48px; border: 1px solid #dbe3ee; border-radius: 4px; font-weight: 700; line-height: 1.05; text-align: center; }
    .code { margin: 0 0 12px; color: #4d71b8; font-size: 14px; font-weight: 700; letter-spacing: .16em; }
    h1 { margin: 0; font-family: Georgia, serif; font-size: clamp(42px, 8vw, 76px); font-weight: 400; line-height: .98; }
    p { max-width: 520px; margin: 24px 0 32px; color: #5d6878; font-size: 18px; line-height: 1.55; }
    a { display: inline-block; padding: 15px 24px; border-radius: 10px; color: #fff; background: #4d71b8; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #192334; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-label="Антон Верт">Антон<br>Верт</div>
    <p class="code">ОШИБКА 404</p>
    <h1>Такой страницы нет</h1>
    <p>Возможно, ссылка устарела или в адресе есть опечатка. Вернитесь на главную — там вся актуальная информация.</p>
    <a href="/">Перейти на главную</a>
  </main>
</body>
</html>
