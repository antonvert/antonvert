name: Deploy Anton final preview

on:
  push:
    branches:
      - codex/final-preview-2026-10-05

concurrency:
  group: antonvert-final-preview-2026-10-05
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy temporary Cloudflare Pages preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html dist/
          cp robots.txt dist/
          cp -R assets dist/assets

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=antonvert-preview --branch=final-preview-2026-10-05 --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
