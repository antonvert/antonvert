name: Deploy antonvert-preview

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "favicon.svg"
      - "404.html"
      - "robots.txt"
      - "_headers"
      - "assets/**"
      - "scripts/visual-qa.cjs"
      - "scripts/build-social-preview.py"
      - ".github/workflows/deploy-anton-preview.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "favicon.svg"
      - "404.html"
      - "robots.txt"
      - "_headers"
      - "assets/**"
      - "scripts/visual-qa.cjs"
      - "scripts/build-social-preview.py"
      - ".github/workflows/deploy-anton-preview.yml"
  workflow_dispatch:

concurrency:
  group: antonvert-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install preview image dependency
        run: python3 -m pip install --disable-pip-version-check "Pillow==12.0.0"

      - name: Prepare static site
        run: |
          rm -rf dist
          mkdir -p dist
          cp index.html dist/
          cp favicon.svg dist/
          cp 404.html dist/
          cp robots.txt dist/
          cp _headers dist/
          cp -R assets dist/assets
          python3 scripts/build-social-preview.py dist/assets/og-antonvert-20261009.png
          test -s dist/assets/og-antonvert-20261009.png

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=antonvert-preview --branch=${{ github.event_name == 'pull_request' && format('preview-{0}', github.event.pull_request.number) || 'main' }} --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Chromium for browser QA
        if: github.event_name == 'pull_request'
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Validate responsive layout and capture first screen
        if: github.event_name == 'pull_request'
        run: |
          node scripts/visual-qa.cjs "https://preview-${{ github.event.pull_request.number }}.antonvert-preview.pages.dev"

      - name: Upload preview screenshots
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: antonvert-visual-qa-${{ github.event.pull_request.number }}
          path: artifacts/qa/*.png
          if-no-files-found: warn
